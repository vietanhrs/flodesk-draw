name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit tests with coverage thresholds
        run: bun run coverage

      - name: Build and check bundle budget
        run: bun run bundle:check

  browser-quality:
    name: Browser quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static-checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright system deps
        run: bunx playwright install-deps chrome

      - name: Lighthouse quality gate
        run: bun run lighthouse:check

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouse/*.json
          if-no-files-found: ignore

      - name: Performance regression tests
        run: bun run test:perf

      - name: E2E tests
        run: bun run test:e2e
